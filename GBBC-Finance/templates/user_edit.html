{% extends 'base.html' %}{% block content %}<div class="heading"><div><p class="eyebrow">Administration</p><h1>Edit user</h1><p class="muted">Update contact information, role, or password for {{ user.name }}.</p></div></div>{% include 'admin_nav.html' %}<section class="card form-card"><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>First name <em>required</em><input name="first_name" required value="{{ user.first_name }}"></label><label>Last name <em>required</em><input name="last_name" required value="{{ user.last_name }}"></label><label>Email address <em>required</em><input name="email" type="email" required value="{{ user.email }}"></label><label>Username (optional)<input name="username" value="{{ user.username or '' }}"></label><label>Phone number <em>required</em><input name="phone" type="tel" required value="{{ user.phone }}"></label><label>Role <em>required</em><select name="role" required>{% for role in roles if current_user.role == 'Super Admin' or role != 'Super Admin' %}<option {{ 'selected' if user.role == role }}>{{ role }}</option>{% endfor %}</select></label><label>Replacement password<input name="password" type="password" minlength="12" placeholder="Leave blank to keep current password"></label><div class="form-actions"><a class="button secondary" href="{{ url_for('users') }}">Cancel</a><button class="button" type="submit">Save user</button></div></form></section>{% endblock %}

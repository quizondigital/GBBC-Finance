{% extends 'base.html' %}{% block content %}<div class="heading"><div><p class="eyebrow">Giving records</p><h1>{{ 'Edit contribution' if gift else 'Record contribution' }}</h1><p class="muted">Select the contributor and enter the gift details.</p></div></div><section class="card form-card"><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Contributor <em>required</em><select name="person_id" required>{% for person in people %}<option value="{{ person.id }}" {{ 'selected' if gift and gift.person_id == person.id }}>{{ person.name }}</option>{% endfor %}</select></label><label>Fiscal year <em>required</em><select name="fiscal_year_id" required>{% for year in years if year.is_open or gift and gift.fiscal_year_id == year.id %}<option value="{{ year.id }}" {{ 'selected' if gift and gift.fiscal_year_id == year.id }}>{{ year.name }} {{ '(closed)' if not year.is_open }}</option>{% endfor %}</select></label><label>Date <em>required</em><input name="date" type="date" required value="{{ gift.date.isoformat() if gift else today.isoformat() }}"></label><label>Amount <em>required</em><input name="amount" type="number" min="0.01" step="0.01" required value="{{ gift.amount if gift else '' }}"></label><label>Fund <em>required</em><select name="fund_id" required>{% for fund in funds %}<option value="{{ fund.id }}" {{ 'selected' if (gift and gift.fund_id == fund.id) or (not gift and fund.id == default_fund_id) }}>{{ fund.name }}</option>{% endfor %}</select></label><label>Payment method <em>required</em><select name="method" required>{% for method in ['Check','Cash','Online','Other'] %}<option {{ 'selected' if gift and gift.method == method }}>{{ method }}</option>{% endfor %}</select></label><label>Reference (e.g. Check #)<input name="reference" value="{{ gift.reference if gift else '' }}"></label><label>Note<input name="note" value="{{ gift.note if gift else '' }}"></label><div class="form-actions"><a class="button secondary" href="{{ url_for('contributions') }}">Cancel</a><button class="button" type="submit">Save contribution</button></div></form></section>{% endblock %}
